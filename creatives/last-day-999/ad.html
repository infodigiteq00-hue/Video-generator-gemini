<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #0a0a0c; --text: #f5f5f7; --text2: rgba(245,245,247,0.68); --text3: rgba(245,245,247,0.42); --gold: #ffb347; --green: #4ade80; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  body.feed { --w: 1080px; --h: 1350px; }
  body.story { --w: 1080px; --h: 1920px; }
  .frame { position: relative; width: var(--w); height: var(--h); overflow: hidden; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .glow { position: absolute; inset: 0; background:
      radial-gradient(60% 40% at 50% 100%, rgba(255,150,60,0.30), transparent 70%),
      radial-gradient(50% 30% at 50% 0%, rgba(255,179,71,0.14), transparent 70%); }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,200,120,0.55) 1.4px, transparent 1.6px); background-size: 46px 46px; mask-image: radial-gradient(70% 40% at 50% 0%, #000, transparent); opacity: .5; }
  .content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%; }
  .brand { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; display: flex; align-items: center; gap: 14px; }
  .brand i { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #ffcf7a, #ff8a3d); display: inline-block; }
  .pill { display: inline-flex; align-items: center; gap: 12px; padding: 14px 28px; border-radius: 999px; font-size: 30px; font-weight: 600; letter-spacing: -0.01em; }
  .pill.red { background: rgba(255,90,70,0.16); color: #ff8f7a; box-shadow: inset 0 0 0 2px rgba(255,90,70,0.35); }
  .pill.gold { background: rgba(255,179,71,0.14); color: var(--gold); box-shadow: inset 0 0 0 2px rgba(255,179,71,0.35); }
  .pill .dot { width: 14px; height: 14px; border-radius: 50%; background: currentColor; box-shadow: 0 0 18px currentColor; }
  h1 { font-weight: 700; letter-spacing: -0.045em; line-height: 0.98; }
  .serif { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; letter-spacing: -0.01em; color: var(--gold); }
  .sub { color: var(--text2); font-size: 36px; line-height: 1.3; letter-spacing: -0.015em; }
  .price { display: flex; align-items: baseline; justify-content: center; gap: 26px; }
  .price b { font-size: 190px; font-weight: 700; letter-spacing: -0.06em; line-height: 1; }
  .price s { font-size: 64px; color: var(--text3); font-weight: 500; text-decoration-thickness: 5px; }
  .note { font-size: 32px; color: var(--text2); }
  .note b { color: var(--text); font-weight: 600; }
  .cta { display: inline-flex; align-items: center; gap: 16px; padding: 34px 64px; border-radius: 999px; background: linear-gradient(180deg, #ffc56b, #ff9a3c); color: #1a0f00; font-size: 42px; font-weight: 700; letter-spacing: -0.02em; box-shadow: 0 20px 60px rgba(255,150,60,0.35); }
  .fan { position: relative; width: 100%; }
  .fan img { position: absolute; left: 50%; border-radius: 30px; box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 2px rgba(255,255,255,0.08); object-fit: cover; }
  .row { display: flex; gap: 22px; justify-content: center; }
  .row img { border-radius: 22px; box-shadow: 0 20px 50px rgba(0,0,0,0.55), 0 0 0 2px rgba(255,255,255,0.08); object-fit: cover; }
  .list { display: grid; gap: 22px; text-align: left; font-size: 36px; letter-spacing: -0.015em; }
  .list div { display: flex; gap: 20px; align-items: center; }
  .list span { flex: none; width: 50px; height: 50px; border-radius: 50%; background: rgba(74,222,128,0.16); color: var(--green); display: grid; place-items: center; font-size: 30px; font-weight: 700; }
  .card { width: 100%; border-radius: 40px; background: linear-gradient(180deg, rgba(255,179,71,0.14), rgba(255,255,255,0.03)); box-shadow: inset 0 0 0 2px rgba(255,179,71,0.3); }
  .clock { display: flex; gap: 18px; justify-content: center; }
  .clock div { width: 150px; padding: 18px 0 14px; border-radius: 24px; background: rgba(255,255,255,0.06); box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08); }
  .clock b { display: block; font-size: 72px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .clock small { font-size: 22px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="frame">
  <div class="glow"></div><div class="dots"></div>
  <div class="content" id="root"></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const c = q.get('c') || '1';
  const story = q.get('s') === 'story';
  document.body.className = story ? 'story' : 'feed';
  const S = (n) => `../../web/public/samples/${n}.webp`;
  const brand = `<div class="brand"><i></i>Digiteq Studio</div>`;
  const cta = (t) => `<div class="cta">${t} <span style="font-size:46px">→</span></div>`;
  const fan = (h) => {
    const w = Math.round(h * 9 / 16), sw = Math.round(w * 0.86), sh = Math.round(h * 0.86);
    return `<div class="fan" style="height:${h + 40}px">
      <img src="${S('diwali-steelcon')}" style="width:${sw}px;height:${sh}px;top:${Math.round(h*0.09)}px;transform:translateX(-118%) rotate(-9deg)">
      <img src="${S('diwali-subhasri')}" style="width:${sw}px;height:${sh}px;top:${Math.round(h*0.09)}px;transform:translateX(18%) rotate(9deg)">
      <img src="${S('diwali-tinita')}" style="width:${w}px;height:${h}px;top:0;transform:translateX(-50%);z-index:2">
    </div>`;
  };
  const pad = story ? '250px 80px 300px' : '80px 80px 80px';
  const R = document.getElementById('root');
  R.style.padding = pad;
  R.style.justifyContent = 'space-between';

  // 1. Last day at ₹999
  if (c === '1') R.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;gap:${story ? 44 : 30}px">
      ${brand}
      <div class="pill red"><span class="dot"></span>Last day · ends at midnight</div>
      <h1 style="font-size:${story ? 112 : 96}px">Your Diwali posts,<br><span class="serif">made for your business</span></h1>
    </div>
    ${fan(story ? 540 : 390)}
    <div style="display:flex;flex-direction:column;align-items:center;gap:${story ? 30 : 22}px">
      <div class="price"><b>₹999</b><s>₹1,999</s></div>
      <p class="note">5 festival posts + 3 videos. <b>₹1,999 from tomorrow.</b></p>
      ${cta('Get it before midnight')}
    </div>`;

  // 2. Retargeting: Diwali is in 2 days
  if (c === '2') R.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;gap:${story ? 44 : 30}px">
      ${brand}
      <div class="pill gold"><span class="dot"></span>Diwali is in 2 days</div>
      <h1 style="font-size:${story ? 100 : 92}px">Still no Diwali post<br>for your business?</h1>
      <p class="sub" style="max-width:860px">Tell us about your business once. We design your Dhanteras, Diwali, New Year, Bhai Dooj and Labh Pancham posts.</p>
    </div>
    <div class="row">
      <img src="${S('diwali-tinita')}" style="width:${story ? 290 : 250}px;height:${story ? 516 : 444}px">
      <img src="${S('diwali-steelcon')}" style="width:${story ? 290 : 250}px;height:${story ? 516 : 444}px;margin-top:${story ? 50 : 40}px">
      <img src="${S('diwali-subhasri')}" style="width:${story ? 290 : 250}px;height:${story ? 516 : 444}px">
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:${story ? 30 : 22}px">
      <p class="note" style="font-size:38px;margin-top:${story ? 20 : 10}px"><b>₹999 today only.</b> ₹1,999 from tomorrow.</p>
      ${cta('Make my Diwali posts')}
    </div>`;

  // 3. What you get, the price card
  if (c === '3') R.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;gap:${story ? 44 : 28}px">
      ${brand}
      <h1 style="font-size:${story ? 90 : 88}px">The whole Diwali Pack.<br><span class="serif">One last day at ₹999.</span></h1>
    </div>
    <div class="card" style="padding:${story ? '64px 60px' : '46px 56px'};display:flex;flex-direction:column;gap:${story ? 40 : 30}px;align-items:center">
      <div class="price"><b style="font-size:${story ? 180 : 150}px">₹999</b><s>₹1,999</s></div>
      <div class="list">
        <div><span>✓</span>5 posts: Dhanteras to Labh Pancham</div>
        <div><span>✓</span>3 of them as videos</div>
        <div><span>✓</span>Your products, colours and logo</div>
        <div><span>✓</span>Ready for WhatsApp &amp; Instagram</div>
      </div>
      <div class="clock" id="clock"></div>
      <p class="note" style="margin-top:-8px">Price goes up to <b>₹1,999</b> at midnight</p>
    </div>
    <div style="margin-top:${story ? 40 : 0}px">${cta('Get my Diwali Pack')}</div>`;

  // A fixed image can't count down, so (3) says when the price ends instead.
  const clock = document.getElementById('clock');
  if (clock) clock.innerHTML = `<div style="width:auto;padding:22px 40px"><b style="font-size:56px">Ends tonight, 11:59 PM</b></div>`;
</script>
</body>
</html>
